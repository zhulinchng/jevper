[project]
name = "incident-triage"
version = "0.1.0"
description = "A support-incident triage service built on jevper, used to exercise the library end to end"
requires-python = ">=3.10"
dependencies = [
  "jevper>=0.7.2",
  "openai>=1.92",
  "anthropic>=0.49",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_triage"]
