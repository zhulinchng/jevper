site_name: jevper
site_description: Typed questions for OpenAI-compatible models
site_url: https://zhulinchng.github.io/jevper/
repo_name: zhulinchng/jevper
repo_url: https://github.com/zhulinchng/jevper
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - mermaid2:
      version: 10.4.0

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Methods: methods.md
      - Reasoning: reasoning.md
      - Few-shot examples: few-shot.md
      - Local servers: local-servers.md
      - MLflow: mlflow.md
  - Reference:
      - API: api.md
      - Internals: internals.md
  - Contributing: contributing.md
