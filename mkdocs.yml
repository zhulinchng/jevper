site_name: jevper
site_description: Typed questions for OpenAI-compatible models
site_url: https://zhulinchng.github.io/jevper/
repo_name: zhulinchng/jevper
repo_url: https://github.com/zhulinchng/jevper
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

# The footer version is asserted against jevper.__version__ by tests/test_release_hygiene.py; see
# the "Claims and releases" section of docs/contributing.md.
copyright: "Copyright © 2026 Zhu Lin · jevper 0.7.10"

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - mermaid2:
      version: 10.4.0

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Complete example: complete-example.md
  - Architecture: architecture.md
  - Guides:
      - Methods: methods.md
      - Reasoning: reasoning.md
      - Few-shot examples: few-shot.md
      - Local servers: local-servers.md
      - MLflow: mlflow.md
      - Troubleshooting: troubleshooting.md
  - Reference:
      - API: api.md
      - Internals: internals.md
      - Glossary: glossary.md
      - Jev comparison: jev-comparison.md
  - Contributing: contributing.md
