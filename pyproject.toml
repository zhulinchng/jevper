[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevper"
version = "0.7.10"
description = "The Jev (System One) interface over any OpenAI-compatible model: noul, choice and score questions in one call"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Zhu Lin", email = "zhulin@czl.my" }]
keywords = ["classification", "confidence", "jev", "llm", "logprobs", "openai", "structured-output", "system-one"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
# openai>=1.92 is the first release whose responses.create accepts top_logprobs (1.91 and earlier
# reject the keyword); the suite exercises that surface directly. anthropic is the client for the
# Messages surface — jevper imports nothing from it, and drives it through the real SDK against the
# stub server, exactly as it does for openai. Nothing jevper sends is newer than this floor: a field the
# API defines but an SDK has no parameter for (prompt_cache_key) travels in the request body instead, and
# tests/test_wire_boundaries.py pins that with a client that types its keywords like the floor release.
test = ["pytest>=8", "openai>=1.92", "anthropic>=0.49"]
# The MLflow integration suite (tests/test_mlflow.py) skips without this. The gateway extra is what puts
# `mlflow gateway` on the CLI at all, and the langchain extra is what the LangChain-flavour test needs.
mlflow = ["mlflow[gateway,langchain]>=3.16"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.6", "mkdocs-mermaid2-plugin>=1.2"]

[project.urls]
Homepage = "https://github.com/zhulinchng/jevper"
Repository = "https://github.com/zhulinchng/jevper"
Issues = "https://github.com/zhulinchng/jevper/issues"
Changelog = "https://github.com/zhulinchng/jevper/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/jevper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
