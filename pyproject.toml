[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevper"
version = "0.1.0"
description = "Jev-shaped (TypeSafe System One) classification wrapper over OpenAI-like clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8", "openai>=1.40"]

[tool.hatch.build.targets.wheel]
packages = ["src/jevper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
